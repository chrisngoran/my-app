[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any non-file route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker, so new deploys are picked up immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
